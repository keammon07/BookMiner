name: Naiin

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python naiinminer.py

      - uses: actions/upload-artifact@v4
        with:
          name: naiin-books
          path: naiin_books.csv
